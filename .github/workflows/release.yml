# Publishes to PyPI when a version tag is pushed. Uses PyPI "trusted publishing": no token or password is stored anywhere.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # a dry run from any branch: builds and checks the package, never publishes
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import os, re
          version = re.search(r'^version = "(.+)"', open("pyproject.toml", encoding="utf-8").read(), re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == "v" + version, f"tag {tag} does not match version {version}"
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  verify:
    # Hands the built files over the same way publish will receive them, and checks them again. In a manual dry run this is what proves
    # the upload and download steps work together, without publishing anything.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: python -m pip install twine
      - run: twine check dist/*
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/memdebug --version
  publish:
    needs: [build, verify]
    if: github.ref_type == 'tag'   # a manual dry run stops after build and verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
