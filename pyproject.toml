[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "memdebug"
version = "0.6.1"
description = "Inspect, compare and roll back what an AI agent's memory holds. Local-first and agent-neutral."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Juraj Jumić" }]
keywords = ["ai-agents", "memory", "security", "forensics", "prompt-injection", "tamper-evident"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["pydantic>=2", "typer>=0.12"]

[project.optional-dependencies]
mem0 = ["mem0ai>=2"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "mypy>=1.11"]  # xdist runs the tests in parallel; the update script uses it when present
test-mem0 = ["pytest>=8", "mem0ai>=2"]  # also runs the check against Mem0's real writer

[project.scripts]
memdebug = "memdebug.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memdebug"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/juraj-jumic/memdebug"
Source = "https://github.com/juraj-jumic/memdebug"
Issues = "https://github.com/juraj-jumic/memdebug/issues"
Changelog = "https://github.com/juraj-jumic/memdebug/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Real mistakes and unused code, sorted imports, and the parts of the Google Python Style Guide
# (https://google.github.io/styleguide/pyguide.html) that a linter can check: docstrings (D, Google convention), naming (N), a type
# annotation on every function (ANN), and no blind "except Exception" without a stated reason (BLE). CONTRIBUTING.md lists where the
# project deliberately differs from the guide.
select = ["E4", "E7", "E9", "F", "I", "B", "D", "N", "ANN", "BLE"]
ignore = [
    "B008",    # typer declares options as default arguments
    "D107",    # an __init__ is documented by its class docstring
    "ANN204",  # special methods such as __init__ need no return annotation (guide 3.19.1)
    "ANN401",  # the guide allows Any where a type should not be expressed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Compact one-line cleanups in test helpers are fine, and the guide asks for neither docstrings nor annotations on tests.
"tests/*" = ["E702", "E731", "D", "ANN", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["memdebug"]

[tool.mypy]
python_version = "3.10"
files = ["src/memdebug"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true  # every function is annotated (guide 2.21); ruff's ANN rules say the same, mypy also checks the types
